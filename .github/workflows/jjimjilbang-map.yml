# 서울 찜질방 지도: 데이터 검사 + 네이버 후기·이미지 자동 갱신
# - push / PR: data/places.js 형식과 좌표를 검사합니다.
# - 매일 새벽(한국시간 03:17) 또는 수동 실행: 네이버 검색 API로 후기·이미지를 다시 모아 커밋합니다.
#   저장소 Settings > Secrets and variables > Actions 에 NAVER_CLIENT_ID, NAVER_CLIENT_SECRET 을 등록해야 동작해요.
#   (예약 실행은 기본 브랜치에서만 돌아갑니다)
name: jjimjilbang-map data

on:
  push:
    paths: ['jjimjilbang-map/**', '.github/workflows/jjimjilbang-map.yml']
  pull_request:
    paths: ['jjimjilbang-map/**']
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: jjimjilbang-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 데이터 검사
        run: node jjimjilbang-map/scripts/validate-data.mjs

  refresh-naver:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 네이버 키가 없으면 건너뛰기
        if: env.NAVER_CLIENT_ID == ''
        run: echo "NAVER_CLIENT_ID 비밀값이 없어 후기 갱신을 건너뜁니다."
      - name: 네이버 블로그 후기·이미지 가져오기
        if: env.NAVER_CLIENT_ID != ''
        run: node jjimjilbang-map/scripts/fetch-naver-content.mjs
      - name: 바뀐 내용 커밋
        if: env.NAVER_CLIENT_ID != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jjimjilbang-map/data/naver-content.js
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "data: 네이버 후기·이미지 갱신"
            git push
          fi
