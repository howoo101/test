<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>서울 찜질방 지도</title>
  <meta name="description" content="서울 찜질방의 요금, 시설, 네이버·인스타 후기, 사진을 지도 위에서 한 번에 비교해요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="panel" id="panel" aria-label="찜질방 목록과 상세 정보">
      <div class="sheet-grip" id="sheetGrip" role="button" tabindex="0" aria-label="목록 패널 크기 바꾸기">
        <span class="grip-bar" aria-hidden="true"></span>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♨</span>
          <h1 class="brand-name">서울 찜질방 지도</h1>
          <span class="brand-sub">요금 · 시설 · 후기 한눈에</span>
        </div>
      </div>

      <div class="panel-head" id="panelHead">
        <div class="search">
          <label class="sr-only" for="q">찜질방 검색</label>
          <input id="q" type="search" placeholder="이름, 동네, 역 이름으로 검색" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="chips" id="chips" role="group" aria-label="빠른 필터"></div>
        <div class="list-meta">
          <span class="count" id="count" aria-live="polite"></span>
          <button type="button" class="mini" id="reset" hidden>초기화</button>
          <div class="selects">
            <label class="sr-only" for="fGu">지역</label>
            <select id="fGu"></select>
            <label class="sr-only" for="fPrice">최대 요금</label>
            <select id="fPrice">
              <option value="">요금 전체</option>
              <option value="10000">1만원 이하</option>
              <option value="13000">1.3만원 이하</option>
              <option value="15000">1.5만원 이하</option>
              <option value="20000">2만원 이하</option>
            </select>
            <label class="sr-only" for="fSort">정렬</label>
            <select id="fSort">
              <option value="rec">추천순</option>
              <option value="price">낮은 요금순</option>
              <option value="near">가까운순</option>
            </select>
          </div>
        </div>
      </div>

      <div class="panel-body" id="panelBody">
        <ul class="list" id="list" aria-label="찜질방 목록"></ul>
        <div class="empty" id="empty" hidden>
          <p><b>조건에 맞는 찜질방이 없어요.</b></p>
          <p>필터를 하나씩 풀어 보세요.</p>
        </div>
        <article class="detail" id="detail" hidden></article>
      </div>
    </aside>

    <main class="map-wrap" aria-label="지도">
      <div class="map" id="map"></div>
      <div class="map-notice" id="mapNotice" role="note" hidden></div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/facilities.js"></script>
  <script src="data/seoul-geo.js"></script>
  <script src="data/places.js"></script>
  <script src="data/naver-content.js"></script>
  <script src="js/map-fallback.js"></script>
  <script src="js/map-naver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
